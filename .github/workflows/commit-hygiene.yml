name: Commit hygiene

# The rule lives once, in Droidtop/droidtop-platforms, and is pinned by commit
# (Droidtop/tracker#199). first-parent: this repository merges an upstream
# project, whose own commits are not ours to check.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    uses: Droidtop/droidtop-platforms/.github/workflows/commit-hygiene.yml@84f44633fc5a8441abae8d6679d2fd27b39cd2ee
    with:
      first-parent: true
