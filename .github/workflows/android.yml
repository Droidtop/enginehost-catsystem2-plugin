name: Build Enginehost bundle

# Only the release lines build. plugin-core is the wrapper alone: it carries no
# engine, so there is nothing there to compile, and a release branch is that
# wrapper merged onto the engine on main.
on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    # Builds and packs the payload. No signing key and no write token here:
    # Gradle, its plugins and the third-party actions below run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Build wrapper library
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Pack the unsigned bundle inputs
        run: |
          set -euo pipefail
          mkdir -p build/unsigned/payload
          unzip -p app/build/outputs/aar/app-release.aar classes.jar > build/classes.jar
          "$ANDROID_HOME/build-tools/36.0.0/d8" --release --min-api 26 --output build/unsigned/payload build/classes.jar
          # The engine itself, every ABI the wrapper build produced. Enginehost
          # puts lib/<abi> from the bundle on the runtime class loader's library
          # path, so this is all it takes for System.loadLibrary to find it.
          # Reading the ABI list out of the aar instead of naming one keeps the
          # packaging step honest when abiFilters changes.
          for abi in $(unzip -Z1 app/build/outputs/aar/app-release.aar 'jni/*/*.so' | cut -d/ -f2 | sort -u); do
            mkdir -p "build/unsigned/payload/lib/$abi"
            unzip -j app/build/outputs/aar/app-release.aar "jni/$abi/*.so" -d "build/unsigned/payload/lib/$abi"
          done
          # Both ABIs are the rule, not a preference: a bundle that lost one
          # would install and then fail to load on half the devices.
          test -f build/unsigned/payload/lib/arm64-v8a/libcatsystem2.so
          test -f build/unsigned/payload/lib/x86_64/libcatsystem2.so
          cp LICENSE THIRD_PARTY.md build/unsigned/payload/
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-catsystem2-cst-v1-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build.
    needs: bundle
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: enginehost-catsystem2-cst-v1-unsigned
      bundle: dev.enginehost.catsystem2.cst.v1.enginehost.tar.xz
      artifact-name: enginehost-catsystem2-cst-v1
      channel: ${{ inputs.channel }}
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  verify:
    # The ABI contract (Droidtop/tracker#39) is about the artifact a person
    # installs, so it is checked on the signed bundle itself, not only on
    # the unpacked build tree: a bundle missing either ABI's libcatsystem2.so
    # fails the run here instead of reaching a release and then failing to
    # load on an x86_64 emulator.
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-catsystem2-cst-v1
          path: bundle
      - name: Fail unless the signed bundle carries both ABIs
        run: |
          set -euo pipefail
          bundle="$(find bundle -name '*.enginehost.tar.xz' -print -quit)"
          test -n "$bundle"
          # Payload files are stored at their payload-relative paths.
          for abi in arm64-v8a x86_64; do
            tar -tJf "$bundle" | grep -x "lib/$abi/libcatsystem2.so" \
              || { echo "::error::$bundle is missing lib/$abi/libcatsystem2.so" >&2; exit 1; }
          done

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-catsystem2-cst-v1
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: verify
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: enginehost-catsystem2-cst-v1
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
