name: Re-sign a stable release

# Re-signs one published stable release in signature format v1 and publishes
# it beside the original as <tag>-resigned (Droidtop/tracker#550). The code is
# unchanged; see Enginehost's .github/workflows/resign-engine-release.yml.
on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: The published stable release to re-sign
        required: true

permissions:
  contents: read

jobs:
  resign:
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/resign-engine-release.yml@96d25415cdb5d8ec31e1a0c0b6e64061cdf3dd1f
    with:
      tooling-sha: 96d25415cdb5d8ec31e1a0c0b6e64061cdf3dd1f
      source-tag: ${{ inputs.source-tag }}
    secrets:
      ENGINEHOST_CERTIFICATE_KEY_PEM: ${{ secrets.ENGINEHOST_CERTIFICATE_KEY_PEM }}
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
